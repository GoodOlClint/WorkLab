name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default token. Steps that need more should request it
# explicitly at the job/step level.
permissions:
  contents: read

# Supersede in-flight runs for the same ref so PR re-pushes don't waste
# runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build+test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Cache build dependencies
        # Exact-key only: no restore-keys fallback. A pin bump in
        # RequiredModules.psd1 changes the hash, and falling back to an older
        # cache silently restored a stale output/RequiredModules whose
        # version subdirs made build.ps1's presence check skip Save-Module
        # entirely — imported the wrong version of pinned modules (e.g.
        # PSProxmoxVE 0.1.1 instead of 0.1.3) and tripped
        # ParameterBindingException at test time. build.ps1 now self-heals
        # mismatched pins, but losing the fallback is the structural fix.
        uses: actions/cache@v5
        with:
          path: output/RequiredModules
          # The 'v2' epoch busts every pre-existing cache. Earlier runs (while
          # build.ps1 still had the directory-only presence check + the
          # restore-keys fallback) baked a mixed-version output/RequiredModules
          # under this key — same version dir, corrupted content — which the
          # self-heal can't detect. Bump the epoch whenever the cached layout
          # is known-polluted and needs a clean rebuild.
          key: ${{ runner.os }}-reqmods-v2-${{ hashFiles('RequiredModules.psd1') }}

      - name: Build + unit tests + analyzer
        shell: pwsh
        run: ./build.ps1 -Tasks build,test

      - name: Publish test results
        # Convenience artifact, not a correctness gate. The artifact service
        # occasionally hiccups (a v7 upload on windows-latest stalled after
        # validation with no error and red-X'd an otherwise-green build), so
        # never let it fail the job.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: output/testResults/*.xml
          if-no-files-found: ignore

  integration:
    name: integration (gated)
    runs-on: ubuntu-latest
    # Each integration test self-skips when its gating env var is unset, so
    # this job is a no-op until repo secrets are populated. The full set is
    # wired below so it "just works" the moment any test's gating env arrives.
    env:
      # Proxmox connection (Phase 0 network + Phase 1 VM lifecycle)
      WORKLAB_PROXMOX_TEST_HOST: ${{ secrets.WORKLAB_PROXMOX_TEST_HOST }}
      WORKLAB_PROXMOX_TEST_TOKEN: ${{ secrets.WORKLAB_PROXMOX_TEST_TOKEN }}
      WORKLAB_PROXMOX_TEST_PORT: ${{ secrets.WORKLAB_PROXMOX_TEST_PORT }}
      WORKLAB_PROXMOX_TEST_NODE: ${{ secrets.WORKLAB_PROXMOX_TEST_NODE }}
      WORKLAB_PROXMOX_TEST_ZONE: ${{ secrets.WORKLAB_PROXMOX_TEST_ZONE }}
      WORKLAB_PROXMOX_TEST_DISK_STORAGE: ${{ secrets.WORKLAB_PROXMOX_TEST_DISK_STORAGE }}
      WORKLAB_PROXMOX_TEST_ISO_STORAGE: ${{ secrets.WORKLAB_PROXMOX_TEST_ISO_STORAGE }}
      # Phase 2 image pipeline (Windows + Windows ISO required)
      WORKLAB_IMG_TEST_SOURCE_ISO: ${{ secrets.WORKLAB_IMG_TEST_SOURCE_ISO }}
    steps:
      - uses: actions/checkout@v6
      - name: Integration tests
        shell: pwsh
        run: ./build.ps1 -Tasks integration
